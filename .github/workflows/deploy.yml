name: Deploy

# 一份工作流，两个平台：
#   - GitHub Pages 由本工作流构建并部署（base = /仓库名/）
#   - Cloudflare Pages 在 Cloudflare 后台单独连接同一仓库（base = /）
# 两边互不影响：任一平台失败，另一个仍在线。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 package.json 的 engines 保持一致；Astro 7 要求 >=22.12.0
          node-version: 24
          cache: npm

      # 必须用 npm ci：它要求 package-lock.json 存在，且严格按锁文件安装。
      # 若仓库里只有 pnpm-lock.yaml，这一步会直接失败。
      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Verify real builds and content contracts
        run: npm run check:base && npm run check:content

      - name: Build for this GitHub Pages repository
        run: npm run build
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Check internal links
        run: npm run check:links
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Require completed frontend before publishing
        if: github.event_name != 'pull_request'
        run: npm run check:frontend

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
